<div class="orderTaking">
  <h2>Nuevo pedido - mesa {{ tableId }}</h2>

  @for (item of availableItems; track item.name) {
    <div class="itemRow">
      <span class="itemName">{{ item.name }}</span>
      <span class="itemPrice">{{ item.price | currency:'EUR':'symbol':'1.2-2' }}</span>
      <input type="number" [(ngModel)]="quantities[item.name]" min="0" class="p-inputtext p-component" style="width: 80px;" />
    </div>
  }

  <p-button label="Enviar pedido" [loading]="saving" (onClick)="submitOrder()" />
</div>
