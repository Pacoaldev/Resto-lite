<div class="orderTaking">
  <h2>Nuevo pedido - mesa {{ tableId() }}</h2>

  @for (item of availableItems(); track item.name) {
    <div class="itemRow">
      <span class="itemName">{{ item.name }}</span>
      <span class="itemPrice">{{ item.price | currency: ordersService.currencyCode():'symbol':'1.2-2' }}</span>
      <span class="itemStock">max {{ item.stock }}</span>
      <input
        type="number"
        min="0"
        [max]="item.stock"
        class="qty-input"
        [value]="quantities()[item.name] ?? 0"
        (input)="setQuantity(item, $any($event.target).value)"
      />
    </div>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="button" class="submit-btn" [disabled]="saving()" (click)="submitOrder()">
    {{ saving() ? 'Enviando…' : 'Enviar pedido' }}
  </button>
</div>
