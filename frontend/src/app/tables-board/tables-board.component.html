<div class="tablesBoard card">
  <h2>Tablero de Mesas</h2>
  <p class="description">Selecciona una mesa libre para tomar comandas o gestionar una orden activa.</p>

  <p-table [value]="tables">
    <ng-template #header>
      <tr>
        <th>Mesa</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-table>
      <tr>
        <td>{{ table.name }}</td>
        <td>
          <p-tag [value]="statusLabel(table.status)" [severity]="statusSeverity(table.status)"></p-tag>
        </td>
        <td>
          <p-button label="Tomar pedido" size="small" (onClick)="onSelectTable(table.id)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
