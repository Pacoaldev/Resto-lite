openapi: 3.0.3
info:
  title: Resto Lite API
  description: API REST para el módulo Lite de gestión de pedidos y mesas.
  version: 1.0.0
paths:
  /api/tables:
    get:
      summary: Listar mesas
      description: Obtiene el listado de mesas del restaurante con su estado de ocupación actual.
      responses:
        '200':
          description: Listado de mesas obtenido con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'

  /api/tables/{id}/request-bill:
    post:
      summary: Solicitar cuenta de una mesa
      description: Genera la factura con IVA del país configurado para los pedidos activos de la mesa y la marca como `billRequested`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cuenta generada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DomainError'

  /api/tables/{id}/settle:
    post:
      summary: Cobrar y liberar una mesa
      description: Marca los pedidos activos como pagados y libera la mesa.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Mesa liberada.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products:
    get:
      summary: Listar productos del menú
      description: Obtiene la lista de productos disponibles para la toma de pedidos.
      responses:
        '200':
          description: Listado de productos obtenido con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /api/orders:
    post:
      summary: Crear un pedido
      description: Crea un nuevo pedido asociado a una mesa específica. Los precios se resuelven server-side; el cliente sólo envía nombre y cantidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tableId
                - items
              properties:
                tableId:
                  type: integer
                  example: 1
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderItemInput'
      responses:
        '201':
          description: Pedido creado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StockConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/orders/{id}/status:
    patch:
      summary: Cambiar estado de un pedido
      description: Actualiza el estado actual de un pedido.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [open, sent, paid, cancelled]
                  example: sent
      responses:
        '204':
          description: Estado del pedido actualizado con éxito.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DomainError'

  /api/establishment:
    get:
      summary: Obtener configuración fiscal
      description: Devuelve el país activo, moneda, nombre, etiqueta y tasa de impuesto.
      responses:
        '200':
          description: Configuración fiscal actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establishment'
    put:
      summary: Cambiar país fiscal
      description: Cambia el país del establecimiento en runtime (afecta a todos los cálculos de IVA/IGV).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - country
              properties:
                country:
                  type: string
                  enum: [es, mx, ar, cl, co, pe]
      responses:
        '200':
          description: País actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establishment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  responses:
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DomainError:
      description: Transición de estado no permitida por el dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Error de validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StockConflict:
      description: Stock insuficiente para uno o más productos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Autenticación requerida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    Table:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [free, occupied, billRequested]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer

    OrderItemInput:
      type: object
      required:
        - name
        - quantity
      properties:
        name:
          type: string
        quantity:
          type: integer

    OrderItem:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer

    Order:
      type: object
      properties:
        id:
          type: integer
        tableId:
          type: integer
        status:
          type: string
          enum: [open, sent, paid, cancelled]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
          format: float

    Bill:
      type: object
      properties:
        tableId:
          type: integer
        orderIds:
          type: array
          items:
            type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          format: float
        taxLabel:
          type: string
        taxRate:
          type: number
          format: float
        taxAmount:
          type: number
          format: float
        total:
          type: number
          format: float
        currency:
          type: string
        country:
          type: string

    Establishment:
      type: object
      properties:
        country:
          type: string
          enum: [es, mx, ar, cl, co, pe]
        currency:
          type: string
        name:
          type: string
        taxLabel:
          type: string
        taxRate:
          type: number
          format: float
        options:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              currency:
                type: string
              name:
                type: string